<div class="relative bg-gray-800 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px">
    <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
            <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                <div class="flex shrink-0 items-center">
                    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
                        alt="Your Company" class="h-8 w-auto" />
                </div>
                <div class="hidden sm:ml-6 sm:block">
                    <div class="flex space-x-4">
                        <!-- Current: "bg-gray-950/50 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
                        <!-- Forma 1 de usar Rutas con Router Link -->
                        <a routerLink="inicio"
                            class="rounded-m px-3 py-2 text-sm font-medium text-white hover:bg-white/5 hover:text-white">
                            Inicio</a>
                        <!-- Forma 2 de Usar Rutas con Router Navigate -->
                        <a (click)="irTailwind()"
                            class="rounded-m px-3 py-2 text-sm font-medium text-white hover:bg-white/5 hover:text-white">Tailwind
                            Ejemplo</a>
                        <a routerLink="directivas"
                            class="rounded-m px-3 py-2 text-sm font-medium text-white hover:bg-white/5 hover:text-white">Directivas</a>

                    </div>
                </div>
            </div>
            <div class="flex">
                <button class="text-white">Iniciar Sesion</button>
            </div>
        </div>
    </div>
</div>
